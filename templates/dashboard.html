<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Особистий кабінет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Cloud App</a>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Вийти</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h2>Вітаємо, {{ name }}! 🎉</h2>
            <p class="text-muted">Ваш email: {{ email }}</p>
            <hr>
            <p>Це ваш захищений персональний кабінет із підтримкою бази даних у хмарі AWS.</p>
        </div>
    </div>
</body>

</html>
